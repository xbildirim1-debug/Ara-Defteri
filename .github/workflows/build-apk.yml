name: Build Taşıtım APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "TASITIM-Demo.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TASITIM-Demo
          path: TASITIM-Demo.apk

      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="demo-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "TASITIM-Demo.apk#Taşıtım Demo APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Taşıtım Demo ${GITHUB_RUN_NUMBER}" \
            --notes "Otomatik oluşturulan Taşıtım demo APK. Akıllı Veri Girişi: Türkçe sesli giriş, kamera/galeri OCR, kilometre, yakıt, bakım, gider ve belge alanlarını otomatik doldurma; kullanıcı onayından sonra kayıt." \
            --prerelease
