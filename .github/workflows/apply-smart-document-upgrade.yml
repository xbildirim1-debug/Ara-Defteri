name: Apply Smart Document Upgrade

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/upgrade_smart_documents.py"
      - ".github/workflows/apply-smart-document-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source upgrade
        run: python3 scripts/upgrade_smart_documents.py

      - name: Commit upgraded sources
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aracdefteri/app/RecordParser.java \
                  app/src/main/java/com/aracdefteri/app/NextMainActivity.java
          git commit -m "Wire smart document analyzer into forms"
          git push
