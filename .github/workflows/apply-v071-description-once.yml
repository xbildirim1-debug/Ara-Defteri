name: Apply Araç Defteri v0.7.1 description cleanup

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-v071-description-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.7.1 cleanup
        run: python tools/apply_v071_description_once.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Commit source changes
        run: |
          git config user.name "Araç Defteri Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/aracdefteri/app/VehicleCvPdf.java app/build.gradle
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Keep CV description only once in its own section"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Arac-Defteri-v0.7.1-cv-cleanup-dev.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arac-Defteri-v0.7.1-cv-cleanup-dev
          path: Arac-Defteri-v0.7.1-cv-cleanup-dev.apk
