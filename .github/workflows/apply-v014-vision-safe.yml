name: Apply v0.14 Vision Safe Upgrade

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/upgrade_v014_vision_safety.py"
      - ".github/workflows/apply-v014-vision-safe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.14 vision-safe upgrade
        run: python3 scripts/upgrade_v014_vision_safety.py

      - name: Commit upgraded sources
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aracdefteri/app/SmartDocumentAnalyzer.java \
                  app/src/main/java/com/aracdefteri/app/ReceiptOcr.java \
                  app/src/main/java/com/aracdefteri/app/NextMainActivity.java \
                  app/build.gradle
          git commit -m "Fix odometer fuel expertise and noisy OCR routing"
          git push
