name: Apply v0.14 Visual OCR Hotfix

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/fix_v014_build.py"
      - ".github/workflows/apply-v014-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hotfix
        run: python3 scripts/fix_v014_build.py

      - name: Commit hotfix
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aracdefteri/app/ReceiptOcr.java \
                  app/src/main/java/com/aracdefteri/app/VisualDocumentAnalyzer.java
          git commit -m "Fix v0.14 visual OCR build and expertise gray detection"
          git push
