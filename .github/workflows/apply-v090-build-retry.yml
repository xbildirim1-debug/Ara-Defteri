name: Apply Taşıtım v0.9.0 retry

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-v090-build-retry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse v0.9.0 patch from canonical workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          src = Path('.github/workflows/apply-v090-tasitim-damage-photos.yml').read_text()
          start = src.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = src.index("\n          PY", start)
          code = textwrap.dedent(src[start:end])
          exec(compile(code, 'v090_patch', 'exec'))
          PY
          # GitHub App token cannot modify workflow files. Keep the existing build workflow unchanged.
          git checkout -- .github/workflows/build-apk.yml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare deliverables
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Tasitim-v0.9.0-damage-photos-dev.apk"
          zip -qr "Tasitim-v0.9.0-source.zip" . -x '.git/*' 'app/build/*' '.gradle/*' '*.apk' '*.zip'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tasitim-v0.9.0-damage-photos-dev-apk
          path: Tasitim-v0.9.0-damage-photos-dev.apk

      - name: Upload source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tasitim-v0.9.0-source
          path: Tasitim-v0.9.0-source.zip

      - name: Commit source changes
        run: |
          git config user.name "Taşıtım Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/aracdefteri/app/AppDatabase.java \
                  app/src/main/java/com/aracdefteri/app/NextMainActivity.java \
                  app/src/main/java/com/aracdefteri/app/VehicleCvPdf.java \
                  app/src/main/AndroidManifest.xml app/build.gradle README.md
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Add Taşıtım branding and multi-photo damage records"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
