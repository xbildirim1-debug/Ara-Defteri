name: Build Taşıtım v0.10 smart input

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-v010-smart-input.yml"

permissions:
  contents: write

jobs:
  smart-input-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.10 smart input patch
        shell: bash
        run: |
          base64 -d .github/patches/v010-smart-input.patch.gz.b64 | gunzip > /tmp/v010.patch
          git apply --check /tmp/v010.patch
          git apply /tmp/v010.patch
          base64 -d .github/patches/v010-smart-input-newfiles.tar.gz.b64 | tar -xzf -
          if [ -f gradle.properties ]; then
            grep -q '^android.useAndroidX=' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          else
            echo 'android.useAndroidX=true' > gradle.properties
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare deliverables
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Tasitim-v0.10.0-smart-input-dev.apk"
          cat > "Tasitim-v0.10.0-Gelistirici-Notlari.txt" <<'NOTES'
          TAŞITIM v0.10.0 SMART INPUT

          Yeni özellikler:
          - ML Kit Text Recognition ile cihaz üzerinde OCR.
          - Kamera veya galeriden fiş/belge okuma.
          - Android konuşma tanıma ile Türkçe sesli kayıt girişi.
          - OCR ve ses için ortak RecordParser.
          - Tarih, kilometre, tutar, firma/istasyon, yakıt türü, litre/kWh ve bakım parçaları ayrıştırma.
          - Türkçe yazıyla sayı desteği: “beş yüz lira”, “yüz yirmi beş bin kilometre”.
          - Kayıt türü otomatik tahmini; farklı tür algılanırsa kullanıcıya geçiş seçeneği.
          - Bulunan alanlar vurgulanır; kullanıcı onayı olmadan otomatik kayıt yapılmaz.
          - OCR ham metni ve kamera ile çekilen geçici tarama fotoğrafı kalıcı saklanmaz.
          - Şase/VIN için uygulamada kayıt alanı oluşturulmaz.

          OCR: com.google.mlkit:text-recognition:16.0.1, bundled Latin model.
          Ses: Android RecognizerIntent; çevrimdışı kullanılabilirlik cihazdaki sağlayıcıya bağlıdır.
          Version code: 13
          Version name: 0.10.0-smart-input-dev

          Bu APK debug imzalı geliştirme APK'sıdır. Play Store sürümünde sabit production keystore / Play App Signing kullanılmalıdır.
          NOTES
          zip -qr "Tasitim-v0.10.0-source.zip" . -x '.git/*' 'app/build/*' '.gradle/*' '*.apk' '*.zip'
          sha256sum "Tasitim-v0.10.0-smart-input-dev.apk" "Tasitim-v0.10.0-source.zip" "Tasitim-v0.10.0-Gelistirici-Notlari.txt" > SHA256SUMS.txt
          mkdir -p package
          cp "Tasitim-v0.10.0-smart-input-dev.apk" "Tasitim-v0.10.0-source.zip" "Tasitim-v0.10.0-Gelistirici-Notlari.txt" SHA256SUMS.txt package/
          (cd package && zip -qr ../Tasitim-v0.10.0-TAM-PAKET.zip .)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasitim-v0.10.0-smart-input-dev-apk
          path: Tasitim-v0.10.0-smart-input-dev.apk

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Tasitim-v0.10.0-source
          path: Tasitim-v0.10.0-source.zip

      - name: Upload full package
        uses: actions/upload-artifact@v4
        with:
          name: Tasitim-v0.10.0-full-package
          path: Tasitim-v0.10.0-TAM-PAKET.zip

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "Taşıtım Builder"
          git config user.email "actions@users.noreply.github.com"
          git add gradle.properties app/build.gradle app/src/main/AndroidManifest.xml \
            app/src/main/java/com/aracdefteri/app/NextMainActivity.java \
            app/src/main/java/com/aracdefteri/app/RecordParser.java \
            app/src/main/java/com/aracdefteri/app/ReceiptOcr.java \
            app/src/main/java/com/aracdefteri/app/VoiceInput.java
          git commit -m "Add offline OCR and Turkish voice smart input"
          git pull --rebase origin main
          git push origin HEAD:main
