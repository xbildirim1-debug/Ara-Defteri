name: Apply Araç Defteri v0.7 CV cleanup

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-v07-cv-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.7 CV cleanup
        run: python tools/apply_v07_cv_cleanup.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v0.7 APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit source changes
        run: |
          git config user.name "Araç Defteri Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/aracdefteri/app/NextMainActivity.java app/src/main/java/com/aracdefteri/app/VehicleCvPdf.java app/build.gradle
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Compact CV remove summary expenses expertise and use full vehicle name"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Arac-Defteri-v0.7.0-cv-cleanup-dev.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arac-Defteri-v0.7.0-cv-cleanup-dev
          path: Arac-Defteri-v0.7.0-cv-cleanup-dev.apk

      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cv-v07-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "Arac-Defteri-v0.7.0-cv-cleanup-dev.apk#Araç Defteri v0.7 APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Araç Defteri v0.7 Kompakt Araç CV" \
            --notes "Kayıt özeti, gider ve ekspertiz CV'den kaldırıldı; Araç Resimleri adı, tam araç varyantı, kullanıcı açıklaması ve daha sıkı PDF yerleşimi eklendi." \
            --prerelease
