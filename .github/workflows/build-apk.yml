name: Build Araç Defteri APK

on:
  push:
    branches: [ "main", "feature/turkiye-odometer" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify storage migration, backups and UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/com.aracdefteri.app/files/qa qa

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Arac-Defteri-Validation
          path: |
            qa/
            app/build/reports/

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Arac-Defteri-Demo.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arac-Defteri-Demo
          path: Arac-Defteri-Demo.apk

      - name: Publish downloadable prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="demo-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "Arac-Defteri-Demo.apk#Araç Defteri Demo APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Araç Defteri Demo ${GITHUB_RUN_NUMBER}" \
            --notes "Otomatik oluşturulan demo APK. Açık/koyu/sistem tema, bakım, hasar, ekspertiz, gider, galeri, hatırlatma ve Araç CV PDF prototipi." \
            --prerelease
