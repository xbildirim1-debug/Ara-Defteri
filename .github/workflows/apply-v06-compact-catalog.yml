name: Apply Araç Defteri v0.6 compact CV

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-v06-compact-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.6 compact CV and catalog changes
        run: python tools/apply_v06_compact_cv.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v0.6 APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit source changes
        run: |
          git config user.name "Araç Defteri Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/aracdefteri/app/NextMainActivity.java \
                  app/src/main/java/com/aracdefteri/app/VehicleCvPdf.java \
                  app/src/main/java/com/aracdefteri/app/TurkeyVehicleSpecs.java \
                  app/src/main/java/com/aracdefteri/app/TurkeyVehicleSpecsExtra.java \
                  app/build.gradle
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Compact CV layout and expand Türkiye vehicle specs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Arac-Defteri-v0.6.0-compact-catalog-dev.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arac-Defteri-v0.6.0-compact-catalog-dev
          path: Arac-Defteri-v0.6.0-compact-catalog-dev.apk

      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="compact-v06-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "Arac-Defteri-v0.6.0-compact-catalog-dev.apk#Araç Defteri v0.6 APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Araç Defteri v0.6 Kompakt CV ve Türkiye Katalog" \
            --notes "Kompakt PDF akışı, gereksiz boş sayfa/alanların kaldırılması, plakasız CV, üst bölümde isteğe bağlı telefon, satış fiyatı seçeneği, Açıklama bölümü ve genişletilmiş Türkiye teknik araç kataloğu." \
            --prerelease
