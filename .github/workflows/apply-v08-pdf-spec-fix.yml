name: Apply Araç Defteri v0.8 PDF and spec fixes

on:
  push:
    paths:
      - '.github/workflows/apply-v08-pdf-spec-fix.yml'

permissions:
  contents: write

jobs:
  migrate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.8 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Türkiye katalogunda eski Corolla Hybrid'i gerçek varyant olarak tanı.
          p = Path('app/src/main/java/com/aracdefteri/app/TurkeyVehicleCatalog.java')
          s = p.read_text()
          old = 'add(TYPE_CAR, "Toyota", "Corolla", "Corolla Sedan", "Auris", "Yaris", "Avensis", "Camry", "Prius", "Aygo", "Supra", "Celica");'
          new = 'add(TYPE_CAR, "Toyota", "Corolla", "Corolla Hybrid", "Corolla Sedan", "Auris", "Yaris", "Avensis", "Camry", "Prius", "Aygo", "Supra", "Celica");'
          assert old in s, 'Toyota katalog satırı bulunamadı'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) 2019-2025 Corolla Hybrid varyantlarını ekle; eski demo/gerçek araçlar da otomatik dolsun.
          p = Path('app/src/main/java/com/aracdefteri/app/TurkeyVehicleSpecs.java')
          s = p.read_text()
          marker = '        // TOYOTA COROLLA 2026 Türkiye.\n'
          assert marker in s, 'Toyota specs marker bulunamadı'
          insert = '''        // TOYOTA COROLLA E210 - Türkiye, eski ve güncel hibrit çekirdek varyantları.\n        add("Toyota", "Corolla", 2019, 2022, "1.8 Hybrid 122 HP e-CVT • Dream", "E210", "Dream", "Sedan", "Hibrit / Benzin", "CVT / e-CVT", "1.8 L Hybrid", "122 hp", "4X2");\n        add("Toyota", "Corolla", 2019, 2022, "1.8 Hybrid 122 HP e-CVT • Flame", "E210", "Flame", "Sedan", "Hibrit / Benzin", "CVT / e-CVT", "1.8 L Hybrid", "122 hp", "4X2");\n        add("Toyota", "Corolla", 2019, 2022, "1.8 Hybrid 122 HP e-CVT • Passion", "E210", "Passion", "Sedan", "Hibrit / Benzin", "CVT / e-CVT", "1.8 L Hybrid", "122 hp", "4X2");\n        add("Toyota", "Corolla Hybrid", 2019, 2022, "1.8 Hybrid 122 HP e-CVT • Dream", "E210", "Dream", "Sedan", "Hibrit / Benzin", "CVT / e-CVT", "1.8 L Hybrid", "122 hp", "4X2");\n        add("Toyota", "Corolla Hybrid", 2019, 2022, "1.8 Hybrid 122 HP e-CVT • Flame", "E210", "Flame", "Sedan", "Hibrit / Benzin", "CVT / e-CVT", "1.8 L Hybrid", "122 hp", "4X2");\n        add("Toyota", "Corolla Hybrid", 2019, 2022, "1.8 Hybrid 122 HP e-CVT • Passion", "E210", "Passion", "Sedan", "Hibrit / Benzin", "CVT / e-CVT", "1.8 L Hybrid", "122 hp", "4X2");\n        add("Toyota", "Corolla", 2023, 2025, "1.8 Hybrid 140 HP e-CVT • Dream", "E210 makyajlı", "Dream", "Sedan", "Hibrit / Benzin", "CVT / e-CVT", "1.8 L Hybrid", "140 hp", "4X2");\n        add("Toyota", "Corolla Hybrid", 2023, 2025, "1.8 Hybrid 140 HP e-CVT • Dream", "E210 makyajlı", "Dream", "Sedan", "Hibrit / Benzin", "CVT / e-CVT", "1.8 L Hybrid", "140 hp", "4X2");\n\n'''
          s = s.replace(marker, insert + marker, 1)

          # Güvenli temel çıkarımda da Corolla Hybrid bilgileri boş kalmasın.
          infer_marker = '        if (m.contains("id.") || m.contains("model y")'
          assert infer_marker in s, 'inferred marker bulunamadı'
          infer_block = '''        if (m.contains("corolla") && m.contains("hybrid")) {\n            body = "Sedan";\n            fuel = "Hibrit / Benzin";\n            trans = "CVT / e-CVT";\n            engine = "1.8 L Hybrid";\n            power = year <= 2022 ? "122 hp" : "140 hp";\n            drive = "4X2";\n        }\n'''
          s = s.replace(infer_marker, infer_block + infer_marker, 1)
          p.write_text(s)

          # 3) PDF: boş ilk sayfayı doldur, kayıtlı alan boşsa katalogdan teknik bilgi kullan.
          p = Path('app/src/main/java/com/aracdefteri/app/VehicleCvPdf.java')
          s = p.read_text()

          old_cover = '''        String phone = pref(prefs, "cv_phone");
        if (!phone.isEmpty()) {
            w.text("İletişim: " + phone, 38, y, 8.5f, Writer.ACCENT_DARK, true);
            y += 17;
        }

        String body = pref(prefs, "vehicle_body");
        String trans = pref(prefs, "vehicle_transmission");
        boolean showPrice = prefs.getBoolean("cv_show_price", false);
        String price = pref(prefs, "cv_sale_price");
        w.coverChip(38, y + 5, 250, "GÜNCEL KM", formatInt(v.km) + " km");
        w.coverChip(307, y + 5, 250, "YAKIT", blankFallback(v.fuelType, "Belirtilmedi"));
        w.coverChip(38, y + 55, 250, "KASA / VİTES", joinNonEmpty(" • ", body, trans));
        if (showPrice && !price.isEmpty())
            w.coverChip(307, y + 55, 250, "İSTENEN SATIŞ FİYATI", price + " ₺");
        else
            w.coverChip(307, y + 55, 250, "MOTOR / GÜÇ", joinNonEmpty(" • ", pref(prefs, "vehicle_engine"), pref(prefs, "vehicle_power")));

        w.text("Bu belge Araç Defteri uygulaması ile kullanıcı kayıtlarından oluşturulmuştur; resmî doğrulama belgesi değildir.", 38, 786, 6.8f, Writer.MUTED, false);
'''
          new_cover = '''        TurkeyVehicleSpecs.Spec spec = resolvedSpec(v, prefs);
        String phone = pref(prefs, "cv_phone");
        if (!phone.isEmpty()) {
            w.text("İletişim: " + phone, 38, y, 8.5f, Writer.ACCENT_DARK, true);
            y += 17;
        }

        String body = resolvedValue(prefs, "vehicle_body", spec == null ? "" : spec.body);
        String trans = resolvedValue(prefs, "vehicle_transmission", spec == null ? "" : spec.transmission);
        String engine = resolvedValue(prefs, "vehicle_engine", spec == null ? "" : spec.engine);
        String power = resolvedValue(prefs, "vehicle_power", spec == null ? "" : spec.power);
        String trim = resolvedValue(prefs, "vehicle_trim", spec == null ? "" : spec.trim);
        String generation = resolvedValue(prefs, "vehicle_generation", spec == null ? "" : spec.generation);
        String drivetrain = resolvedValue(prefs, "vehicle_drivetrain", spec == null ? "" : spec.drivetrain);
        String fuel = blankFallback(v.fuelType, spec == null ? "Belirtilmedi" : spec.fuel);
        if ((v.fuelType == null || v.fuelType.trim().isEmpty()) && spec != null && !spec.fuel.isEmpty()) fuel = spec.fuel;
        boolean showPrice = prefs.getBoolean("cv_show_price", false);
        String price = pref(prefs, "cv_sale_price");

        // İlk sayfayı boş bırakma: temel ve teknik özellikleri üç kompakt satırda göster.
        w.coverChip(38, y + 5, 250, "GÜNCEL KM", formatInt(v.km) + " km");
        w.coverChip(307, y + 5, 250, "YAKIT", blankFallback(fuel, "Belirtilmedi"));
        w.coverChip(38, y + 55, 250, "MOTOR / GÜÇ", joinNonEmpty(" • ", engine, power));
        w.coverChip(307, y + 55, 250, "ŞANZIMAN", blankFallback(trans, "Belirtilmedi"));
        w.coverChip(38, y + 105, 250, "KASA / ÇEKİŞ", joinNonEmpty(" • ", body, drivetrain));
        w.coverChip(307, y + 105, 250, "PAKET / NESİL", joinNonEmpty(" • ", trim, generation));
        int infoEnd = y + 160;
        if (showPrice && !price.isEmpty()) {
            w.coverChip(38, y + 155, 519, "İSTENEN SATIŞ FİYATI", price + " ₺");
            infoEnd = y + 210;
        }

        String note = pref(prefs, "cv_note");
        if (!note.isEmpty() && infoEnd < 690) {
            w.text("AÇIKLAMA", 38, infoEnd + 10, 7.2f, Writer.ACCENT_DARK, true);
            int noteY = w.drawWrapped(note, 38, infoEnd + 27, 7.8f, Writer.DARK, false, Writer.CONTENT_W, 11);
            infoEnd = Math.min(noteY + 8, 742);
        }
        w.text("Bu belge Araç Defteri uygulaması ile kullanıcı kayıtlarından oluşturulmuştur; resmî doğrulama belgesi değildir.", 38, Math.min(Math.max(infoEnd + 12, 650), 786), 6.8f, Writer.MUTED, false);
'''
          assert old_cover in s, 'Eski cover bloğu bulunamadı'
          s = s.replace(old_cover, new_cover, 1)

          old_identity = '''        w.newPage(true);
        w.section("Araç bilgileri", "Teknik ve kayıtlı araç bilgileri");

        w.keyValue("Araç türü", prefOr(prefs, "vehicle_type", "Otomobil"));
        w.keyValue("Marka / Model", v.brand + " / " + v.model);
        w.keyValue("Model yılı", String.valueOf(v.year));
        w.keyValue("Motor / Paket / Versiyon", pref(prefs, "vehicle_catalog_variant"));
        w.keyValue("Nesil / Seri", pref(prefs, "vehicle_generation"));
        w.keyValue("Paket / Versiyon", pref(prefs, "vehicle_trim"));
        w.keyValue("Kasa tipi", pref(prefs, "vehicle_body"));
        w.keyValue("Yakıt", v.fuelType);
        w.keyValue("Şanzıman", pref(prefs, "vehicle_transmission"));
        w.keyValue("Motor", pref(prefs, "vehicle_engine"));
        w.keyValue("Motor gücü", pref(prefs, "vehicle_power"));
        w.keyValue("Çekiş", pref(prefs, "vehicle_drivetrain"));
        w.keyValue("Renk", pref(prefs, "vehicle_color"));
        w.keyValue("Güncel kilometre", formatInt(v.km) + " km");

        if (note != null && !note.trim().isEmpty()) {
            w.ensure(72);
            w.y += 4;
            w.section("Açıklama", null);
            w.paragraph(note.trim(), 8.2f, Writer.DARK);
            w.y += 3;
        }
'''
          new_identity = '''        w.newPage(true);
        w.section("Araç bilgileri", "Teknik ve kayıtlı araç bilgileri");
        TurkeyVehicleSpecs.Spec spec = resolvedSpec(v, prefs);

        w.keyValue("Araç türü", prefOr(prefs, "vehicle_type", "Otomobil"));
        w.keyValue("Marka / Model", v.brand + " / " + v.model);
        w.keyValue("Model yılı", String.valueOf(v.year));
        w.keyValue("Motor / Paket / Versiyon", resolvedValue(prefs, "vehicle_catalog_variant", spec == null ? "" : spec.variant));
        w.keyValue("Nesil / Seri", resolvedValue(prefs, "vehicle_generation", spec == null ? "" : spec.generation));
        w.keyValue("Paket / Versiyon", resolvedValue(prefs, "vehicle_trim", spec == null ? "" : spec.trim));
        w.keyValue("Kasa tipi", resolvedValue(prefs, "vehicle_body", spec == null ? "" : spec.body));
        w.keyValue("Yakıt", (v.fuelType == null || v.fuelType.trim().isEmpty()) && spec != null ? spec.fuel : v.fuelType);
        w.keyValue("Şanzıman", resolvedValue(prefs, "vehicle_transmission", spec == null ? "" : spec.transmission));
        w.keyValue("Motor", resolvedValue(prefs, "vehicle_engine", spec == null ? "" : spec.engine));
        w.keyValue("Motor gücü", resolvedValue(prefs, "vehicle_power", spec == null ? "" : spec.power));
        w.keyValue("Çekiş", resolvedValue(prefs, "vehicle_drivetrain", spec == null ? "" : spec.drivetrain));
        w.keyValue("Renk", pref(prefs, "vehicle_color"));
        w.keyValue("Güncel kilometre", formatInt(v.km) + " km");
'''
          assert old_identity in s, 'Identity bloğu bulunamadı'
          s = s.replace(old_identity, new_identity, 1)

          old_full = '''    private static String fullVehicleName(AppDatabase.Vehicle v, SharedPreferences prefs) {
        String variant = pref(prefs, "vehicle_catalog_variant");
        if (variant.isEmpty()) {
            variant = joinNonEmpty(" ", pref(prefs, "vehicle_engine"), pref(prefs, "vehicle_trim"), pref(prefs, "vehicle_transmission"));
        }
        return joinNonEmpty(" ", String.valueOf(v.year), v.brand, v.model, variant);
    }
'''
          new_full = '''    private static TurkeyVehicleSpecs.Spec resolvedSpec(AppDatabase.Vehicle v, SharedPreferences prefs) {
        String variant = pref(prefs, "vehicle_catalog_variant");
        TurkeyVehicleSpecs.Spec exact = TurkeyVehicleSpecs.find(v.brand, v.model, v.year, variant);
        if (exact != null) return exact;
        List<TurkeyVehicleSpecs.Spec> specs = TurkeyVehicleSpecs.specsFor(v.brand, v.model, v.year);
        if (!specs.isEmpty()) {
            String fuelHint = v.fuelType == null ? "" : v.fuelType.toLowerCase(new Locale("tr", "TR"));
            for (TurkeyVehicleSpecs.Spec candidate : specs) {
                String candidateFuel = candidate.fuel == null ? "" : candidate.fuel.toLowerCase(new Locale("tr", "TR"));
                if (!fuelHint.isEmpty() && (candidateFuel.contains(fuelHint) || fuelHint.contains(candidateFuel))) return candidate;
                if (fuelHint.contains("hibrit") && candidateFuel.contains("hibrit")) return candidate;
                if (fuelHint.contains("dizel") && candidateFuel.contains("dizel")) return candidate;
                if (fuelHint.contains("benzin") && !fuelHint.contains("hibrit") && candidateFuel.equals("benzin")) return candidate;
            }
            return specs.get(0);
        }
        return TurkeyVehicleSpecs.inferred(prefOr(prefs, "vehicle_type", "Otomobil"), v.brand, v.model, v.year);
    }

    private static String resolvedValue(SharedPreferences prefs, String key, String fallback) {
        String value = pref(prefs, key);
        return value.isEmpty() ? blankFallback(fallback, "Belirtilmedi") : value;
    }

    private static String fullVehicleName(AppDatabase.Vehicle v, SharedPreferences prefs) {
        TurkeyVehicleSpecs.Spec spec = resolvedSpec(v, prefs);
        String variant = pref(prefs, "vehicle_catalog_variant");
        if (variant.isEmpty() && spec != null && !spec.variant.isEmpty() && !"Otomatik temel bilgi".equals(spec.variant)) variant = spec.variant;
        if (variant.isEmpty()) {
            variant = joinNonEmpty(" ", resolvedValue(prefs, "vehicle_engine", spec == null ? "" : spec.engine), resolvedValue(prefs, "vehicle_trim", spec == null ? "" : spec.trim), resolvedValue(prefs, "vehicle_transmission", spec == null ? "" : spec.transmission));
        }
        return joinNonEmpty(" ", String.valueOf(v.year), v.brand, v.model, variant);
    }
'''
          assert old_full in s, 'fullVehicleName bloğu bulunamadı'
          s = s.replace(old_full, new_full, 1)
          p.write_text(s)

          # 4) Sürüm yükselt.
          p = Path('app/build.gradle')
          s = p.read_text()
          s = s.replace("versionCode 7", "versionCode 8")
          s = s.replace("versionName '0.7.1-cv-cleanup-dev'", "versionName '0.8.0-pdf-spec-fix-dev'")
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aracdefteri/app/TurkeyVehicleCatalog.java app/src/main/java/com/aracdefteri/app/TurkeyVehicleSpecs.java app/src/main/java/com/aracdefteri/app/VehicleCvPdf.java app/build.gradle
          git commit -m 'Fix CV layout and auto vehicle specs' || true
          git push

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Arac-Defteri-v0.8.0-pdf-spec-fix-dev.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arac-Defteri-v0.8.0-pdf-spec-fix-dev
          path: Arac-Defteri-v0.8.0-pdf-spec-fix-dev.apk
          retention-days: 90
