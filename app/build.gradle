plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aracdefteri.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aracdefteri.app'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.7.1-cv-cleanup-dev'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
