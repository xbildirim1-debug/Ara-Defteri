plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aracdefteri.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aracdefteri.app'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '0.17-assistant-obd-test'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    // Bundled ML Kit Latin text recognizer: cihazda çalışır, OCR metni sunucuya gönderilmez.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}

